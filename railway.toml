# Railway config for the main web service (deco-production).
# Connect GitHub repo deco-pro1234/deco_sys, branch main, root /.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
